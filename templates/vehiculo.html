<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle del vehículo — Auto Smart</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0c0f; --surface:#12151a; --surface2:#1a1e26; --border:#232830; --accent:#e8ff47; --accent2:#ff3366;
          --red:#ff4747; --text:#f0f2f5; --text2:#b8bec8; --muted:#6b7280; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Barlow',sans-serif; }
  header { padding:20px 40px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
  .logo { font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:800; color:var(--text); text-decoration:none; }
  .logo span { color:var(--accent); }
  .nav { display:flex; gap:22px; }
  .nav a { color:var(--muted); text-decoration:none; font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; }
  .nav a:hover { color:var(--accent); }
  main { max-width:1100px; margin:0 auto; padding:30px 40px 60px; }
  .volver { color:var(--muted); text-decoration:none; font-size:14px; }
  .volver:hover { color:var(--accent); }
  .ficha { display:grid; grid-template-columns:1.2fr 1fr; gap:28px; margin-top:18px; }
  .foto { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:14px; background:var(--surface2); }
  .ph { width:100%; aspect-ratio:4/3; border-radius:14px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:70px; }
  .badge { display:inline-block; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-right:6px; }
  .badge.usado { background:var(--accent); color:#000; } .badge.nuevo { background:var(--accent2); color:#fff; } .badge.vendido { background:var(--red); color:#fff; }
  h1 { font-family:'Barlow Condensed',sans-serif; font-size:36px; line-height:1.05; margin:10px 0 6px; }
  .marca { color:var(--muted); }
  .precio { font-family:'Barlow Condensed',sans-serif; font-size:42px; font-weight:800; color:var(--accent); margin:14px 0; }
  .specs { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .spec { background:var(--surface2); border-radius:10px; padding:10px 12px; }
  .spec .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; }
  .spec .v { font-weight:600; margin-top:2px; }
  .chip { display:inline-block; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:3px 10px; font-size:12px; color:var(--text2); margin:2px; }
  .btn { display:block; width:100%; text-align:center; padding:14px; border-radius:10px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:17px; cursor:pointer; text-decoration:none; margin-top:10px; }
  .btn.primary { background:var(--accent); color:#000; border:none; }
  .btn.primary:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; }
  .btn.sec { background:none; border:1px solid var(--border); color:var(--text); }
  .msg { margin-top:10px; font-size:14px; color:var(--text2); min-height:20px; }
  @media (max-width:820px) { .ficha { grid-template-columns:1fr; } main, header { padding-left:16px; padding-right:16px; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">AUTO<span>SMART</span></a>
  <nav class="nav"><a href="/">CATÁLOGO</a><a href="/dashboard">DASHBOARD</a><a href="/reportes">REPORTES</a><a href="/admin">ADMIN</a></nav>
</header>
<main>
  <a class="volver" href="/">← Volver al catálogo</a>
  <div id="ficha" class="ficha"><p style="color:var(--muted)">Cargando…</p></div>
</main>
<script>
const ID = {{ vehiculo_id|tojson }};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cop = n => "$ " + Number(n || 0).toLocaleString("es-CO");
const FUENTES = { autocosmos: "Autocosmos", carroya: "CarroYa", manual: "AutoSmart" };

(async () => {
  const r = await fetch(`/api/vehiculos/${ID}`);
  const el = document.getElementById("ficha");
  if (!r.ok) { el.innerHTML = `<p>Vehículo no encontrado.</p>`; return; }
  const v = await r.json();
  document.title = `${v.title} — Auto Smart`;
  const vendido = v.estado === "vendido", sinPrecio = !(v.price > 0);
  el.innerHTML = `
    <div>${v.image ? `<img class="foto" src="${esc(v.image)}" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;ph&quot;>🚗</div>'">` : `<div class="ph">🚗</div>`}</div>
    <div>
      <span class="badge ${v.condition === "nuevo" ? "nuevo" : "usado"}">${v.condition === "nuevo" ? "Nuevo" : "Usado"}</span>${vendido ? `<span class="badge vendido">Vendido</span>` : ""}
      <h1>${esc(v.title)}</h1><div class="marca">${esc(v.marca)} · ${esc(FUENTES[v.source] || v.source)}</div>
      <div class="precio">${v.price > 0 ? cop(v.price) : "Consultar precio"}</div>
      <div class="specs">
        <div class="spec"><div class="k">Año</div><div class="v">${esc(v.year || "N/A")}</div></div>
        <div class="spec"><div class="k">Kilometraje</div><div class="v">${esc(v.mileage || "N/A")}</div></div>
        <div class="spec"><div class="k">Ciudad</div><div class="v">${esc(v.location || "Colombia")}</div></div>
        <div class="spec"><div class="k">Publicado</div><div class="v">${esc(v.fecha_extraccion || "—")}</div></div>
      </div>
      ${(v.etiquetas || []).length ? `<div>${v.etiquetas.map(e => `<span class="chip">${esc(e)}</span>`).join("")}</div>` : ""}
      <button class="btn primary" id="agregar" ${vendido || sinPrecio ? "disabled" : ""}>${vendido ? "VENDIDO" : sinPrecio ? "SIN PRECIO PUBLICADO" : "🛒 AGREGAR AL CARRITO"}</button>
      ${v.url && v.url.startsWith("http") ? `<a class="btn sec" href="${esc(v.url)}" target="_blank">Ver anuncio original →</a>` : ""}
      <div class="msg" id="msg"></div>
    </div>`;
  document.getElementById("agregar").onclick = async () => {
    const resp = await fetch("/api/cart", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ vehicle_id: ID }) });
    const d = await resp.json();
    document.getElementById("msg").innerHTML = resp.ok ? `${esc(d.mensaje)} <a href="/" style="color:var(--accent)">Ir al catálogo para pagar →</a>` : esc(d.error);
  };
})();
</script>
</body>
</html>
