<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes — Auto Smart</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#0a0c0f; --surface:#12151a; --surface2:#1a1e26; --border:#232830; --accent:#e8ff47;
          --red:#ff4747; --good:#2fd27a; --text:#f0f2f5; --text2:#b8bec8; --muted:#6b7280; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Barlow',sans-serif; }
  header { padding:20px 40px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border);
           position:sticky; top:0; background:rgba(10,12,15,.95); backdrop-filter:blur(12px); z-index:100; }
  .logo { font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:800; color:var(--text); text-decoration:none; }
  .logo span { color:var(--accent); }
  .nav { display:flex; gap:22px; }
  .nav a { color:var(--muted); text-decoration:none; font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; letter-spacing:.5px; }
  .nav a:hover, .nav a.active { color:var(--accent); }
  main { padding:28px 40px 60px; max-width:1400px; margin:0 auto; }
  h1 { font-family:'Barlow Condensed',sans-serif; font-size:40px; font-weight:800; }
  .sub { color:var(--muted); font-size:14px; margin:4px 0 18px; }
  .indice { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
  .indice a { background:var(--surface2); border:1px solid var(--border); color:var(--text2); text-decoration:none; padding:7px 12px; border-radius:20px; font-size:13px; }
  .indice a:hover { border-color:var(--accent); color:var(--accent); }

  .reporte { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:22px; scroll-margin-top:90px; }
  .r-head { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  .tipo { font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:1px; font-weight:700; }
  .reporte h2 { font-family:'Barlow Condensed',sans-serif; font-size:26px; margin:2px 0 4px; }
  .pregunta { color:var(--text2); font-size:15px; }
  .filtros { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .filtros label { display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  input, select { background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:8px; font-family:'Barlow',sans-serif; font-size:13px; }
  .btn { background:var(--accent); color:#000; border:none; padding:9px 14px; border-radius:8px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .cuerpo { display:grid; grid-template-columns:1.1fr 1fr; gap:20px; margin-top:18px; }
  .chart-box { position:relative; height:320px; }
  .meta { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:14px; }
  .meta code { color:var(--text2); }
  .interp { font-size:14px; color:var(--text2); margin-top:10px; border-left:3px solid var(--accent); padding-left:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; padding:8px; border-bottom:1px solid var(--border); }
  td { padding:8px; border-bottom:1px solid var(--border); color:var(--text2); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .tabla { max-height:320px; overflow:auto; }
  details { margin-top:14px; }
  summary { cursor:pointer; color:var(--accent); font-size:14px; font-weight:600; }
  pre { background:#06080a; border:1px solid var(--border); border-radius:10px; padding:14px; margin-top:10px; font-size:12px;
        color:#cfe3ff; overflow:auto; max-height:420px; line-height:1.45; }
  .vacio { color:var(--muted); padding:30px; text-align:center; }
  @media (max-width:980px) { .cuerpo { grid-template-columns:1fr; } header, main { padding-left:16px; padding-right:16px; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">AUTO<span>SMART</span></a>
  <nav class="nav"><a href="/">CATÁLOGO</a><a href="/dashboard">DASHBOARD</a><a href="/reportes" class="active">REPORTES</a><a href="/admin">ADMIN</a></nav>
</header>
<main>
  <h1>Reportes</h1>
  <p class="sub">Consultas avanzadas ejecutadas en MongoDB con el framework de agregación (<code>aggregate</code>). Cada reporte muestra el pipeline exacto que se envía.</p>
  <div class="indice" id="indice"></div>
  <div id="reportes"></div>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cop = n => "$ " + Math.round(Number(n || 0)).toLocaleString("es-CO");
const corto = n => { n = Number(n || 0); return n >= 1e9 ? "$" + (n/1e9).toLocaleString("es-CO",{maximumFractionDigits:1}) + " mil M" : n >= 1e6 ? "$" + (n/1e6).toLocaleString("es-CO",{maximumFractionDigits:1}) + "M" : cop(n); };
const fmt = (v, t) => t === "dinero" ? cop(v) : t === "numero" ? Number(v || 0).toLocaleString("es-CO") : esc(v ?? "—");
const charts = {};
const hoy = new Date(), haceUnAnio = new Date(hoy.getTime() - 365 * 864e5);
const iso = d => d.toISOString().slice(0, 10);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
if (window.Chart) {
  Chart.defaults.font.family = "'Barlow', sans-serif"; Chart.defaults.color = css("--muted"); Chart.defaults.borderColor = css("--border");
  Chart.defaults.plugins.legend.display = false;
  Object.assign(Chart.defaults.plugins.tooltip, { backgroundColor: css("--surface2"), borderColor: css("--border"), borderWidth: 1,
    titleColor: css("--text"), bodyColor: css("--text2"), padding: 10, displayColors: false });
}

function filtrosHTML(r) {
  let h = "";
  if (r.filtros.includes("fechas")) h += `<label>Desde<input type="date" data-p="desde" value="${iso(haceUnAnio)}"></label><label>Hasta<input type="date" data-p="hasta" value="${iso(hoy)}"></label>`;
  if (r.filtros.includes("top")) h += `<label>Cuántos<select data-p="top">${[3,5,10].map(n => `<option ${n===5?"selected":""}>${n}</option>`).join("")}</select></label>`;
  if (r.filtros.includes("condicion")) h += `<label>Condición<select data-p="condition"><option value="">Nuevos y usados</option><option value="nuevo">Nuevos</option><option value="usado">Usados</option></select></label>`;
  return h + `<button class="btn" onclick="ejecutar('${r.id}')">EJECUTAR</button>`;
}

async function ejecutar(id) {
  const sec = document.getElementById(id);
  const params = new URLSearchParams();
  sec.querySelectorAll("[data-p]").forEach(i => i.value && params.set(i.dataset.p, i.value));
  const zona = sec.querySelector(".zona");
  zona.innerHTML = `<div class="vacio">Ejecutando en MongoDB…</div>`;
  try {
    const r = await (await fetch(`/api/reportes/${id}?${params}`)).json();
    if (r.error) throw new Error(r.error);
    if (!r.resultados.length) { zona.innerHTML = `<div class="vacio">La consulta no devolvió resultados con esos filtros.</div>` + pipelineHTML(r); return; }
    zona.innerHTML = `<div class="cuerpo">
        <div class="chart-box"><canvas id="c-${id}" role="img" aria-label="${esc(r.titulo)}"></canvas></div>
        <div class="tabla"><table><thead><tr>${r.columnas.map(([, t, f]) => `<th class="${f !== "texto" ? "num" : ""}">${t}</th>`).join("")}</tr></thead>
          <tbody>${r.resultados.map(fila => `<tr>${r.columnas.map(([k, , f]) => `<td class="${f !== "texto" ? "num" : ""}">${fmt(fila[k], f)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      </div>
      <div class="interp">${esc(r.interpretacion)}</div>
      <div class="meta"><span>Colección: <code>${r.coleccion}</code></span><span>${r.resultados.length} resultado(s)</span><span>${r.ms} ms</span>
        <span>Índices usados: <code>${r.indices.length ? r.indices.join(", ") : "ninguno (recorre la colección)"}</code></span></div>` + pipelineHTML(r);
    dibujar(id, r);
  } catch (e) { zona.innerHTML = `<div class="vacio">Error: ${esc(e.message)}</div>`; }
}
const pipelineHTML = r => `<details><summary>Ver pipeline de agregación</summary><pre>db.${r.coleccion}.aggregate(${esc(r.pipeline)})</pre></details>`;

function dibujar(id, r) {
  if (!window.Chart) return;
  if (charts[id]) charts[id].destroy();
  const g = r.grafico, datos = r.resultados.slice(0, 15), horizontal = g.tipo === "barra_h";
  charts[id] = new Chart(document.getElementById(`c-${id}`), {
    type: "bar",
    data: { labels: datos.map(d => d[g.etiqueta] ?? "—"),
            datasets: [{ data: datos.map(d => d[g.valor]), backgroundColor: css("--accent"), hoverBackgroundColor: "#f4ff9a",
                         borderRadius: 4, borderSkipped: "start", maxBarThickness: 30 }] },
    options: { indexAxis: horizontal ? "y" : "x", responsive: true, maintainAspectRatio: false,
      scales: { [horizontal ? "x" : "y"]: { beginAtZero: true, grid: { color: "rgba(255,255,255,.05)" }, border: { display: false },
                                            ticks: { maxTicksLimit: 5, callback: v => g.formato === "dinero" ? corto(v) : v } },
                [horizontal ? "y" : "x"]: { grid: { display: false }, ticks: { color: css("--text2") } } },
      plugins: { tooltip: { callbacks: { label: it => g.formato === "dinero" ? cop(it.raw) : it.raw } } } }
  });
}

(async () => {
  const lista = await (await fetch("/api/reportes")).json();
  document.getElementById("indice").innerHTML = lista.map((r, i) => `<a href="#${r.id}">${i + 1}. ${esc(r.titulo)}</a>`).join("");
  document.getElementById("reportes").innerHTML = lista.map((r, i) => `
    <section class="reporte" id="${r.id}">
      <div class="r-head"><div><div class="tipo">${i + 1} · ${esc(r.tipo)}</div><h2>${esc(r.titulo)}</h2><div class="pregunta">${esc(r.pregunta)}</div></div>
        <div class="filtros">${filtrosHTML(r)}</div></div>
      <div class="zona"></div>
    </section>`).join("");
  lista.forEach(r => ejecutar(r.id));
})();
</script>
</body>
</html>
